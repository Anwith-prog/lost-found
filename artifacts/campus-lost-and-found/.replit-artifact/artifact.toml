kind = "web"
previewPath = "/"
title = "Campus Lost & Found"
description = "A shared campus lost-and-found board where anyone can browse reports, file lost or found item reports, attach photos, and discover likely matches."
version = "1.0.0"
id = "artifacts/campus-lost-and-found"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20114

[services.development]
run = "pnpm --filter @workspace/campus-lost-and-found run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-lost-and-found", "run", "build" ]
serve = "static"
publicDir = "artifacts/campus-lost-and-found/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20114"
BASE_PATH = "/"

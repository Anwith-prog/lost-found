openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reports
    description: Lost-and-found reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List lost-and-found reports
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Create a lost-and-found report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /reports/{id}/matches:
    get:
      operationId: findReportMatches
      tags: [reports]
      summary: Find likely matches for a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suggested matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportMatch"
        "404":
          description: Report not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Report:
      type: object
      required: [id, type, description, location, dateTime, category, contact, image, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [lost, found] }
        description: { type: string }
        location: { type: string }
        dateTime: { type: string }
        category: { type: string }
        contact: { type: string }
        image: { type: ["string", "null"] }
        createdAt: { type: string }
    ReportInput:
      type: object
      required: [type, description, location, dateTime, category]
      properties:
        type: { type: string, enum: [lost, found] }
        description: { type: string, minLength: 1 }
        location: { type: string, minLength: 1 }
        dateTime: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        contact: { type: string }
        image: { type: ["string", "null"] }
    ReportMatch:
      type: object
      required: [report, confidence, explanation]
      properties:
        report: { $ref: "#/components/schemas/Report" }
        confidence: { type: number, minimum: 0, maximum: 100 }
        explanation: { type: string }

